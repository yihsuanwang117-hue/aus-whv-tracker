<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澳洲打工度假生活必備 & 德國碩士自保金進度追蹤</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    .tab-active {
      border-bottom: 2px solid #8C3B07 !important;
      color: #8C3B07 !important;
      font-weight: bold !important;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen pb-16">

  <!-- 頂部導航 -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-amber-800 flex items-center justify-center text-white shadow-inner font-bold text-lg">
          AU
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-stone-900 tracking-tight">
            澳洲打工度假 × 德國碩士自保金
          </h1>
          <p class="text-xs text-stone-500">AU 烏魯魯旅程 • DE 2027 留學自保金 (40萬 NTD)</p>
        </div>
      </div>
      
      <!-- 頂部即時連線與匯率 -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex items-center bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-1 text-xs text-stone-600 shadow-sm">
          <span class="mr-1 text-stone-400">1 AUD = </span>
          <input type="number" id="fxRateInput" step="0.1" value="23.0" class="w-12 bg-white border border-stone-300 rounded px-1 py-0.5 font-mono text-center font-bold text-stone-800 focus:outline-none" onchange="updateFxRate(this.value)">
          <span class="ml-1 text-stone-500 font-medium">TWD</span>
        </div>

        <div class="flex items-center bg-stone-50 border border-stone-200 rounded-lg p-1 text-xs shadow-sm">
          <input type="text" id="syncKeyDirect" placeholder="自訂同步密碼" class="bg-white border border-stone-300 rounded px-2 py-1 w-32 text-stone-800 focus:outline-none font-mono">
          <button type="button" onclick="connectDirectSync()" id="syncDirectBtn" class="ml-1 px-2.5 py-1 bg-amber-800 hover:bg-amber-900 text-white rounded font-semibold transition cursor-pointer">
            連線同步
          </button>
        </div>

        <button type="button" onclick="exportData()" class="px-2.5 py-1 text-stone-600 hover:text-stone-900 bg-stone-50 border border-stone-200 rounded-lg text-xs transition cursor-pointer">
          備份
        </button>
      </div>
    </div>

    <!-- 頁籤選單 -->
    <div class="max-w-5xl mx-auto px-4 flex space-x-6 text-sm">
      <button type="button" onclick="switchTab('finance')" id="tab-finance" class="py-2.5 tab-active flex items-center space-x-1 cursor-pointer">
        <span>雙幣財務 & 自保金</span>
      </button>
      <button type="button" onclick="switchTab('calendar')" id="tab-calendar" class="py-2.5 text-stone-500 hover:text-stone-800 flex items-center space-x-1 cursor-pointer">
        <span>重要時程日曆</span>
      </button>
      <button type="button" onclick="switchTab('gear')" id="tab-gear" class="py-2.5 text-stone-500 hover:text-stone-800 flex items-center space-x-1 cursor-pointer">
        <span>出發裝備清單</span>
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-5xl mx-auto px-4 mt-6">

    <!-- TAB 1: 財務與自保金 -->
    <div id="content-finance" class="space-y-6">
      <!-- 總卡片 -->
      <div class="bg-gradient-to-br from-stone-900 to-stone-800 rounded-2xl p-6 text-white shadow-lg">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div>
            <span class="px-2 py-0.5 text-[11px] font-semibold bg-amber-600/40 text-amber-300 rounded border border-amber-500/30">
              2027 德國碩士自保金目標：NT$ 400,000 (約 $17,391 AUD)
            </span>
            <div class="mt-2 flex items-baseline gap-2">
              <h2 id="totalSavings
